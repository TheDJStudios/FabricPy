[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcmod"
version = "0.1.0"
description = "Write Minecraft mods in Python using pluggable loader backends"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Repository = "https://github.com/TheDJStudios/FabricPy"
Issues = "https://github.com/TheDJStudios/FabricPy/issues"
Documentation = "https://github.com/TheDJStudios/FabricPy/blob/main/docs/index.md"

[project.scripts]
fabricpy = "fabricpy.__main__:main"

[tool.setuptools.packages.find]
include = ["fabricpy", "fabricpy.compiler"]
namespaces = false

[tool.setuptools.package-data]
fabricpy = ["addons/**/*.py"]
